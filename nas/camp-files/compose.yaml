services:
  storage-init:
    image: node:24-alpine
    user: "0:0"
    command: ["sh", "-c", "chown 1000:1000 /data && chmod 700 /data"]
    volumes:
      - ./data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"
  camp-files:
    build: .
    restart: unless-stopped
    depends_on:
      storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      TEACH_NAS_TOKEN: ${TEACH_NAS_TOKEN:?Set TEACH_NAS_TOKEN in .env}
    volumes:
      - ./data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    networks:
      - default
      - docs-tunnel
networks:
  docs-tunnel:
    external: true
    name: wolko-docs_default
