<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV 대시보드 편집기 v2 — 디자인 시안 (더미 데이터)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* wolko.org 팔레트: #004f68 / #007ea1 / #73d1f5 / #c42a36 / #12303c / #0a1e28
   글자 크기는 모두 --u(= 화면 너비의 1%)를 JS로 계산해서 사용 → 최신 CSS 기능(cqw 등)이 없는 TV 브라우저에서도 동작 */
:root{--f-sans:'Montserrat',sans-serif;--f-body:'Noto Sans KR',sans-serif;--ui-bg:#f4f6f8;--ui-border:#e4eaee;--ui-text:#12303c;--ui-mid:#5a6f79;--blue:#004f68;--blue-mid:#007ea1;--red:#c42a36}
.theme-dark{--bg:#0a1e28;--panel:#0f3445;--stat:#004f68;--line:#1f5870;--text:#fff;--muted:#a9c7d3;--accent:#73d1f5;--warn:#ffd08a;--hi-bg:#5d2a33;--hi:#ffb4ba;--md-bg:#4d4528;--md:#ffe09b;--lo-bg:#1d4a5e;--lo:#a8e0f7}
.theme-light{--bg:#eaf2f5;--panel:#fff;--stat:#004f68;--line:#d7e4e8;--text:#12303c;--muted:#5a6f79;--accent:#007ea1;--warn:#b86a00;--hi-bg:#fde8ea;--hi:#c42a36;--md-bg:#fff0dd;--md:#b86a00;--lo-bg:#e3f2f8;--lo:#00708f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ui-bg);color:var(--ui-text);font-family:var(--f-body)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;background:#fff;border-bottom:1px solid var(--ui-border);position:relative;z-index:30}
.bar h1{margin:0;font:800 15px var(--f-sans);color:var(--blue);margin-right:auto}
.badge{background:#fff4e5;color:#9a5a00;border:1px solid #f3d6a6;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}
.seg{display:inline-flex;background:var(--ui-bg);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font:600 12.5px var(--f-body);color:var(--ui-mid);cursor:pointer}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px #0002}
.btn{border:1px solid var(--ui-border);background:#fff;color:var(--blue);height:32px;padding:0 12px;border-radius:10px;font:600 12.5px var(--f-body);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.sm{height:26px;padding:0 8px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--red)}
.menuwrap{position:relative}
.menu{display:none;position:absolute;top:36px;left:0;width:300px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--ui-border);border-radius:12px;box-shadow:0 12px 30px #0a1e2833;padding:8px}
.menu.open{display:block}
.menu .mi{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:13px}
.menu .mi:hover{background:var(--ui-bg)}.menu .mi small{margin-left:auto;color:var(--ui-mid);font-size:11px}
.pages{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:#fff;border-bottom:1px solid var(--ui-border)}
.pg{border:1px solid var(--ui-border);background:#fff;border-radius:10px;padding:6px 12px;font:600 12.5px var(--f-body);color:var(--ui-mid);cursor:pointer}
.pg.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pg small{opacity:.75;margin-left:6px;font-weight:500}
.main{display:flex;gap:14px;flex-wrap:wrap;padding:14px;align-items:flex-start}
.stage{flex:1 1 520px;min-width:0}
.inspector{flex:0 0 290px;max-width:100%;background:#fff;border:1px solid var(--ui-border);border-radius:14px;padding:14px}
.inspector h3{margin:0 0 8px;font:700 13px var(--f-body)}
.inspector section{padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--ui-border)}
.inspector section:last-child{border:0;margin:0;padding:0}
.f{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}
.f>label{flex:0 0 96px;color:var(--ui-mid)}.f>div{flex:1;display:flex;align-items:center;gap:6px}
.f input[type=range]{flex:1}
.f input[type=number],.f input[type=text],.f select{width:100%;height:28px;border:1px solid var(--ui-border);border-radius:8px;padding:0 8px;font:500 12.5px var(--f-body)}
.hintbox{font-size:12px;color:var(--ui-mid);line-height:1.55;background:var(--ui-bg);border-radius:10px;padding:9px 10px}
.canvas{position:relative;width:min(100%,calc((100vh - 150px)*16/9));min-width:300px;aspect-ratio:16/9;margin:0 auto;background:var(--bg);color:var(--text);border-radius:10px;overflow:hidden;box-shadow:0 8px 30px #0a1e2833;font-family:var(--f-body);transition:opacity .35s}
.canvas.fade{opacity:0}
.editing .canvas{background-image:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px);background-size:6.25% 11.111%}
.theme-light.editing .canvas{background-image:linear-gradient(#00000012 1px,transparent 1px),linear-gradient(90deg,#00000012 1px,transparent 1px)}
.canvas:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}
.widget{position:absolute;padding:calc(var(--u)*.35);--k:calc(var(--u)*var(--s,1))}
.w-in{font-size:calc(var(--k)*1);line-height:1.2;position:relative;width:100%;height:100%;background:var(--panel);border-radius:calc(var(--u)*1);padding:calc(var(--u)*.8) calc(var(--u)*1.1);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.theme-light .w-in{box-shadow:0 1px 4px #12303c14}
.editing .widget{cursor:grab;touch-action:none}
.editing .widget.drag{z-index:9;opacity:.92;cursor:grabbing}
.editing .widget.bad .w-in{outline:3px solid #ff5a67}
.editing .widget.sel .w-in{outline:3px solid #ffb347}
.editing .widget:hover .w-in{outline:2px dashed var(--accent)}
.tools,.label,.rs{display:none}
.editing .tools,.editing .label{display:block}.editing .rs{display:block}
.tools{position:absolute;top:-1px;right:calc(var(--u)*.35);z-index:5}
.tools button{width:max(18px,calc(var(--u)*1.7));height:max(18px,calc(var(--u)*1.7));border:0;border-radius:50%;background:#c42a36;color:#fff;font:700 max(10px,calc(var(--u)*.9))/1 var(--f-sans);cursor:pointer;display:grid;place-items:center;padding:0}
.label{position:absolute;left:calc(var(--u)*.35);top:-1px;font:700 max(9px,calc(var(--u)*.7)) var(--f-body);color:#fff;background:var(--blue-mid);padding:1px calc(var(--u)*.6);border-radius:0 0 6px 6px;z-index:5;white-space:nowrap;max-width:75%;overflow:hidden;text-overflow:ellipsis}
.rs{position:absolute;right:calc(var(--u)*.2);bottom:calc(var(--u)*.2);width:max(16px,calc(var(--u)*1.6));height:max(16px,calc(var(--u)*1.6));cursor:nwse-resize;z-index:5;border-right:3px solid var(--accent);border-bottom:3px solid var(--accent);border-radius:0 0 8px 0}
/* 위젯 내용 (모두 --k = 화면 단위 × 위젯 글자 배율) */
.hd{display:flex;justify-content:space-between;align-items:center;padding-bottom:calc(var(--k)*.55);margin-bottom:calc(var(--k)*.3);border-bottom:1px solid var(--line);flex:0 0 auto}
.hd h2{margin:0;font:700 calc(var(--k)*1.45) var(--f-body)}.hd span{color:var(--muted);font-size:calc(var(--k)*1)}
.ct{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:space-around}
.it{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--k)*.8);padding:calc(var(--k)*.3) 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it b{display:block;font:600 calc(var(--k)*1.15)/1.25 var(--f-body)}
.it .sub{display:block;color:var(--muted);font-size:calc(var(--k)*.9);margin-top:calc(var(--k)*.15)}
.compact .sub,.compact .noteb{display:none}
.st{text-align:right;font-size:calc(var(--k)*.88);color:var(--muted);flex:0 0 auto}
.pri{display:inline-block;margin-top:calc(var(--k)*.2);padding:calc(var(--k)*.15) calc(var(--k)*.65);border-radius:calc(var(--k)*.5);font:700 calc(var(--k)*.8) var(--f-sans)}
.hi{background:var(--hi-bg);color:var(--hi)}.md{background:var(--md-bg);color:var(--md)}.lo{background:var(--lo-bg);color:var(--lo)}
.soon{color:var(--warn);font-weight:700}
.center{align-items:center;justify-content:center;text-align:center}
.big{font:800 calc(var(--k)*4.2)/1 var(--f-sans)}
.cap{color:var(--muted);font-size:calc(var(--k)*1.2);margin-top:calc(var(--k)*.3)}
.brand small{display:block;color:var(--accent);font:700 calc(var(--k)*.62) var(--f-sans);letter-spacing:.16em}
.brand h1{margin:calc(var(--k)*.05) 0;font:800 calc(var(--k)*1.6)/1.1 var(--f-sans);white-space:nowrap}
.brand div{color:var(--muted);font-size:calc(var(--k)*.62)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--k)*.8);height:100%}
.tile{display:flex;align-items:center;justify-content:space-between;background:var(--stat);color:#fff;border-radius:calc(var(--k)*.8);padding:0 calc(var(--k)*1.2)}
.tile label{font-size:calc(var(--k)*1.15);opacity:.85}.tile strong{font:800 calc(var(--k)*2.3) var(--f-sans)}
.noteb{white-space:pre-line;color:var(--muted);font-size:calc(var(--k)*1.05);line-height:1.5;margin-top:calc(var(--k)*.2)}
.notice{padding:calc(var(--k)*.45) 0;color:var(--warn);font-size:calc(var(--k)*1.15);line-height:1.35}
.bars .row{margin:calc(var(--k)*.3) 0}.bars .row div{font-size:calc(var(--k)*1);display:flex;justify-content:space-between}
.bars i{display:block;height:calc(var(--k)*.7);border-radius:99px;background:var(--line);overflow:hidden;margin-top:calc(var(--k)*.2)}
.bars i u{display:block;height:100%;background:var(--accent);border-radius:99px}
.wx{font:600 calc(var(--k)*1.3) var(--f-body);white-space:nowrap}
.clk{font:700 calc(var(--k)*2.3)/1 var(--f-sans)}
.dots{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*.7);display:none;z-index:8}
.viewing .dots{display:block}
.dots i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.9;width:0}
.pgdots{position:absolute;right:calc(var(--u)*1);bottom:calc(var(--u)*1);display:none;gap:6px;z-index:8}
.viewing .pgdots{display:flex}
.pgdots b{width:calc(var(--u)*.8);height:calc(var(--u)*.8);border-radius:50%;background:var(--muted);opacity:.5}.pgdots b.on{background:var(--accent);opacity:1}
.empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:calc(var(--u)*1.4);text-align:center}
</style>
</head>
<body class="theme-dark editing" id="root">
<div class="bar">
  <h1>TV 대시보드 편집기 v2</h1>
  <span class="badge">시안 · 더미 데이터 · 이 브라우저에만 저장</span>
  <div class="menuwrap">
    <button class="btn pri" id="addBtn">+ 위젯 추가</button>
    <div class="menu" id="addMenu"></div>
  </div>
  <div class="seg" id="modeSeg"><button data-m="edit" class="on">편집</button><button data-m="view">슬라이드쇼 미리보기</button></div>
  <div class="seg" id="themeSeg"><button data-t="dark" class="on">진한 청록</button><button data-t="light">밝은 화면</button></div>
  <button class="btn" id="fs">전체 화면</button>
  <button class="btn" id="reset">기본값으로</button>
</div>
<div class="pages" id="pages"></div>
<div class="main">
  <div class="stage"><div class="canvas" id="canvas"></div></div>
  <aside class="inspector" id="inspector"></aside>
</div>

<script>
const COLS=16,ROWS=9,CELL=100/COLS; // 한 칸 = 화면 너비의 6.25% (16:9 → 정사각형 칸)
const $=s=>document.querySelector(s),root=$('#root'),canvas=$('#canvas');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let U=10;

/* ============ 더미 데이터 ============ */
const TASKS=[
['Recruit staff and confirm team roster','Leader B','Winter Camp','','In Progress','hi'],
['Confirm speakers, breakout topics and schedule','Leader C','Winter Camp','2026-11-30','In Progress','hi'],
['Launch camp promotion and registration','Leader B','Winter Camp','','In Progress','hi'],
['Prepare English/Bible classes and classroom equipment','Leader D','Winter Camp','','In Progress','hi'],
['Confirm Unity Camp dates, fees and breakout plan','All Together','Unity Camp','2026-10-23','In Progress','hi'],
['Recruit Unity staff, leaders and participant registrations','All Together','Unity Camp','','In Progress','hi'],
['Finalize training program and QT materials','Leader C','Winter Camp','','Not Started','hi'],
['Confirm staff accommodation, meals and safety training','Leader B','Winter Camp','','Not Started','hi'],
['Prepare camp printed materials, name tags and clothing','Leader C','Winter Camp','','Not Started','md'],
['Plan camp vehicle transportation and cleanup','Leader C','Winter Camp','','Not Started','hi'],
['Finalize participant list, dorms and registration','Leader B','Winter Camp','','Not Started','hi'],
['Prepare orientation, games and venue setup','Program Team','Winter Camp','','Not Started','hi'],
['Prepare cabins and Gospel counseling training','Counselor Team','Winter Camp','','Not Started','hi'],
['Prepare worship team, instruments and slides','Music Team','Winter Camp','','Not Started','hi'],
['Check camp media, slides, photo/video plan','Tech & Media Team','Winter Camp','','Not Started','md'],
['Complete Unity safety, training and transport readiness','All Together','Unity Camp','','Not Started','hi'],
['Complete camp evaluation, finance and follow-up','Leader A','Winter Camp','','Not Started','md'],
['Confirm partner church/school camp needs and schedule','Leader A','Partner Camp','','Waiting for Confirmation','hi']];
const EVENTS=[['Leader D Out of Office','Sun, Oct 18 – Wed, Oct 21'],['Outreach at Leader B\'s Church','Fri, Oct 23'],['Leader C Out of Office','Tue, Oct 27'],['Camp & Outreach Huddle','Tue, Oct 27 · 10:00'],['Staff Devos','Wed, Oct 28 · 09:30'],['Winter Camp Speaker Call','Thu, Oct 29 · 14:00'],['Unity Camp Planning','Mon, Nov 2 · 10:00'],['Camp Crew Orientation','Sat, Nov 7 · 13:00']];
const MEET=[['Unity Camp fee','Early 70,000\nRegular 85,000'],['Winter Camp theme','2027 Sample Theme\nSample verse'],['Staff roster','Draft due before the next meeting'],['Partner church schedule','Leader B confirms dates this week']];
const NOTICES=['Camp meetings: Unity camp fee and breakout session theme need decisions.','2027 Theme (sample) / Sample verse 1:1','Please upload your meeting notes to the portal after each meeting.','Office closed Thu, Nov 26 for Night of Thanksgiving prep.'];
const LATE=[['Prepare camp printed materials, name tags and clothing','No owner'],['Complete Unity safety, training and transport readiness','No owner'],['Recruit staff and confirm team roster','No due date'],['Launch camp promotion and registration','No due date'],['Finalize participant list, dorms and registration','No due date'],['Prepare cabins and Gospel counseling training','No due date']];

/* ============ 위젯 정의 ============ */
const priLabel={hi:'HIGH',md:'MEDIUM',lo:'LOW'};
const T={
 brand:{name:'제목 · 로고',min:[2,1],size:[6,1],fit:1,html:()=>`<div class="brand"><small>WORD OF LIFE KOREA</small><h1>Camp &amp; Outreach Operations</h1><div>CAMP TEAM · OFFICE DASHBOARD</div></div>`},
 weather:{name:'날씨',min:[1,1],size:[4,1],fit:1,html:()=>`<div class="ct center"><div class="wx">Pyeongtaek · 9°C</div><div class="cap" style="margin:0">Clear</div></div>`},
 clock:{name:'시계 · 날짜',min:[2,1],size:[6,1],fit:1,html:()=>`<div class="ct center" style="align-items:flex-end;text-align:right"><div class="clk">20:53</div><div class="cap" style="margin:calc(var(--k)*.2) 0 0;font-size:calc(var(--k)*.85)">Wednesday, Oct 21, 2026</div></div>`},
 stats:{name:'통계 (진행·마감·완료율)',min:[4,1],size:[16,1],fit:1,bare:1,html:()=>`<div class="tiles"><div class="tile"><label>Open Tasks</label><strong>18</strong></div><div class="tile"><label>Overdue Tasks</label><strong>0</strong></div><div class="tile"><label>Completion</label><strong>10%</strong></div></div>`},
 dday:{name:'캠프 D-Day',min:[2,2],size:[4,2],fit:1,html:()=>`<div class="hd"><h2>D-Day</h2><span>Winter Camp</span></div><div class="ct center"><div class="big">D-84</div><div class="cap">2027 Winter Camp</div></div>`},
 progress:{name:'캠프별 준비 진행률',min:[3,2],size:[6,3],fit:1,html:()=>`<div class="hd"><h2>Camp Prep Progress</h2><span></span></div><div class="ct bars">${[['Winter Camp',18],['Unity Camp',12],['Partner Camp',5]].map(c=>`<div class="row"><div><span>${c[0]}</span><b>${c[1]}%</b></div><i><u style="width:${c[1]}%"></u></i></div>`).join('')}</div>`},
 theme:{name:'캠프 주제 · 말씀',min:[2,1],size:[6,2],fit:1,html:()=>`<div class="ct center"><div style="font:800 calc(var(--k)*1.9) var(--f-sans);color:var(--accent)">2027 Sample Theme</div><div class="cap">Sample verse</div></div>`},
 /* 목록형: 한 번에 보이는 개수 + 자동 넘김 */
 tasks:{name:'Priority Tasks · 업무',min:[3,2],size:[9,4],list:1,title:'Priority Tasks',ih:3.9,ihc:2.2,data:TASKS,item:t=>`<div class="it"><div><b>${t[0]}</b><span class="sub">${t[1]} · ${t[2]}${t[3]?` · <span class="${t[3]<'2026-10-24'?'soon':''}">Due ${t[3]}</span>`:''}</span></div><div class="st">${t[4]}<br><span class="pri ${t[5]}">${priLabel[t[5]]}</span></div></div>`},
 events:{name:'Upcoming Schedule · 스케줄',min:[3,2],size:[7,4],list:1,title:'Upcoming Schedule',ih:3.5,ihc:2.2,data:EVENTS,item:e=>`<div class="it"><div><b>${e[0]}</b><span class="sub">${e[1]}</span></div></div>`},
 meetings:{name:'Recent Meeting Decisions · 회의 결과',min:[3,2],size:[9,3],list:1,title:'Recent Meeting Decisions',ih:6.2,ihc:2.4,data:MEET,item:m=>`<div class="it"><div><b>${m[0]}</b><div class="noteb">${m[1]}</div></div></div>`},
 notices:{name:'Team Announcements · 팀 안내',min:[3,2],size:[7,3],list:1,title:'Team Announcements',ih:3.4,ihc:2.6,data:NOTICES,item:n=>`<div class="notice">${n}</div>`},
 late:{name:'확인 필요 (담당·기한 미정)',min:[3,2],size:[5,3],list:1,title:'Needs Attention',ih:3.7,ihc:2.2,data:LATE,item:t=>`<div class="it"><div><b>${t[0]}</b><span class="sub">${t[1]}</span></div></div>`}
};

/* ============ 기본 구성: 화면 2개 ============ */
let uidN=1;const nid=()=>'w'+(uidN++)+Math.random().toString(36).slice(2,5);
function W(type,x,y,w,h,opts){return{uid:nid(),type,x,y,w,h,opts:opts||{}}}
function DEFAULT(){return{pages:[
 {id:nid(),name:'메인',secs:30,items:[W('brand',0,0,6,1),W('weather',6,0,4,1),W('clock',10,0,6,1),W('stats',0,1,16,1),W('tasks',0,2,9,4,{secs:10}),W('events',9,2,7,4,{secs:10}),W('meetings',0,6,9,3,{secs:8}),W('notices',9,6,7,3,{secs:15})]},
 {id:nid(),name:'전체 업무',secs:30,items:[W('brand',0,0,6,1),W('weather',6,0,4,1),W('clock',10,0,6,1),W('tasks',0,1,10,8,{secs:12,compact:1}),W('late',10,1,6,3,{secs:10}),W('dday',10,4,6,2),W('progress',10,6,6,3)]}
]}}
const KEY='wolko-tv-builder-v2';
let S=load();let cur=0,sel=null,mode='edit',idx={},vp=0,pageStart=0;
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o.pages&&o.pages.length)return o}}catch(e){}return DEFAULT()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const page=()=>S.pages[mode==='view'?vp:cur];

/* ============ 렌더링 ============ */
const hit=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
const free=(r,ignore)=>r.x>=0&&r.y>=0&&r.x+r.w<=COLS&&r.y+r.h<=ROWS&&!page().items.some(o=>o.uid!==ignore&&hit(r,o));
function place(el,r){el.style.left=r.x/COLS*100+'%';el.style.top=r.y/ROWS*100+'%';el.style.width=r.w/COLS*100+'%';el.style.height=r.h/ROWS*100+'%'}

function baseScale(it){const d=T[it.type];return clamp(Math.min(it.w/d.size[0],it.h/d.size[1]),d.list?.85:.6,1.5)}
function scaleOf(it){const o=it.opts;if(o.fs)return o.fs/100;return baseScale(it)}
function perPage(it,s){const d=T[it.type],o=it.opts;if(o.n)return Math.min(o.n,d.data.length);
  const Hu=it.h*CELL-3.4; // 위젯 높이(화면 너비의 %) - 안쪽 여백
  const head=o.noTitle?0:3.5*s;const ih=(o.compact?d.ihc:d.ih)*s;
  return clamp(Math.floor((Hu-head)/ih),1,d.data.length)}

function body(it){
  const d=T[it.type],o=it.opts;
  if(!d.list)return d.html(o);
  const s=scaleOf(it),n=perPage(it,s),pages=Math.max(1,Math.ceil(d.data.length/n)),p=(idx[it.uid]||0)%pages;
  const rows=d.data.slice(p*n,p*n+n).map(d.item).join('');
  return `${o.noTitle?'':`<div class="hd"><h2>${d.title}</h2><span>${pages>1?`${p+1} / ${pages}`:''}</span></div>`}<div class="ct">${rows}</div>`;
}
function fit(el,it){ // 자동 글자 크기: 칸에 안 들어가면 줄인다
  const d=T[it.type];if(!d.fit||it.opts.fs)return;
  const inner=el.querySelector('.w-in');let s=baseScale(it),k=0;
  el.style.setProperty('--s',s);
  while(k++<14&&(inner.scrollHeight>inner.clientHeight+3||inner.scrollWidth>inner.clientWidth+3)&&s>.3){s*=.92;el.style.setProperty('--s',s)}
}
function widgetEl(it){
  const d=T[it.type],el=document.createElement('div');
  el.className='widget'+(it.opts.compact?' compact':'')+(sel===it.uid?' sel':'');el.dataset.uid=it.uid;place(el,it);
  el.style.setProperty('--s',scaleOf(it));
  el.innerHTML=`<div class="w-in" ${d.bare?'style="background:transparent;padding:0;box-shadow:none"':''}>${body(it)}</div><div class="label">${d.name}</div><div class="tools"><button title="이 화면에서 빼기" data-x>✕</button></div><div class="rs"></div>`;
  return el;
}
function setU(){U=canvas.clientWidth/100;canvas.style.setProperty('--u',U+'px')}
function render(){
  setU();canvas.innerHTML='';
  const p=page();
  p.items.forEach(it=>{const el=widgetEl(it);canvas.appendChild(el);fit(el,it)});
  if(!p.items.length)canvas.innerHTML='<div class="empty">비어 있는 화면입니다.<br>위의 “+ 위젯 추가”로 채워 보세요.</div>';
  canvas.insertAdjacentHTML('beforeend',`<div class="dots"><i id="pbar"></i></div><div class="pgdots">${S.pages.map((_,i)=>`<b class="${i===vp?'on':''}"></b>`).join('')}</div>`);
  if(mode==='edit'){tabs();inspect()}
}
function rerenderWidget(uid){
  const it=page().items.find(i=>i.uid===uid),old=canvas.querySelector(`[data-uid="${uid}"]`);if(!it||!old)return;
  const el=widgetEl(it);canvas.replaceChild(el,old);fit(el,it);
}

/* ============ 화면(페이지) 탭 ============ */
function tabs(){
  $('#pages').innerHTML=S.pages.map((p,i)=>`<button class="pg ${i===cur?'on':''}" data-p="${i}">${p.name}<small>${p.secs}초</small></button>`).join('')+`<button class="btn sm" data-addpage>+ 화면 추가</button><span style="margin-left:auto;font-size:12px;color:#5a6f79">슬라이드쇼: ${S.pages.map(p=>p.secs).reduce((a,b)=>a+b,0)}초에 한 바퀴</span>`;
}
$('#pages').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]');if(b){cur=+b.dataset.p;sel=null;render();return}
  if(e.target.closest('[data-addpage]')){S.pages.push({id:nid(),name:'화면 '+(S.pages.length+1),secs:20,items:[]});cur=S.pages.length-1;sel=null;save();render()}
});

/* ============ 오른쪽 설정 패널 ============ */
function inspect(){
  const p=S.pages[cur],it=p.items.find(i=>i.uid===sel),d=it&&T[it.type];
  let h=`<section><h3>이 화면 설정</h3>
   <div class="f"><label>이름</label><div><input type="text" data-pk="name" value="${p.name}"></div></div>
   <div class="f"><label>표시 시간</label><div><input type="number" min="5" max="600" data-pk="secs" value="${p.secs}"> 초</div></div>
   <div class="f"><label>순서</label><div><button class="btn sm" data-mv="-1">◀ 앞으로</button><button class="btn sm" data-mv="1">뒤로 ▶</button></div></div>
   <div class="f"><label></label><div><button class="btn sm" data-dup>복제</button><button class="btn sm danger" data-delpage ${S.pages.length<2?'disabled':''}>화면 삭제</button></div></div></section>`;
  if(!it){h+=`<section><h3>위젯 설정</h3><div class="hintbox">위젯을 클릭하면 여기에서 글자 크기, 한 번에 보이는 항목 수, 자동 넘김 시간을 정할 수 있어요.<br><br>끌어서 이동 · 오른쪽 아래 모서리로 크기 조절 · ✕ 로 빼기</div></section>`}
  else{
    const o=it.opts,fsAuto=!o.fs;
    h+=`<section><h3>${d.name}</h3>
    <div class="f"><label>글자 크기</label><div><select data-ok="fsmode"><option value="auto" ${fsAuto?'selected':''}>자동 (칸에 맞춤)</option><option value="man" ${fsAuto?'':'selected'}>직접 정하기</option></select></div></div>
    ${fsAuto?'':`<div class="f"><label></label><div><input type="range" min="40" max="260" step="5" data-ok="fs" value="${o.fs}"><b style="width:44px;text-align:right">${o.fs}%</b></div></div>`}`;
    if(d.list){
      const s=scaleOf(it),n=perPage(it,s),pgs=Math.ceil(d.data.length/n);
      h+=`<div class="f"><label>한 번에 보이는 개수</label><div><select data-ok="n"><option value="0" ${o.n?'':'selected'}>자동 (현재 ${perPage({...it,opts:{...o,n:0}},s)}개)</option>${[1,2,3,4,5,6,7,8,10,12].map(v=>`<option value="${v}" ${o.n===v?'selected':''}>${v}개</option>`).join('')}</select></div></div>
      <div class="f"><label>넘어가는 시간</label><div><input type="number" min="3" max="120" data-ok="secs" value="${o.secs||10}"> 초</div></div>
      <div class="f"><label>간단히 보기</label><div><input type="checkbox" data-ok="compact" ${o.compact?'checked':''}> 보조 설명 숨기고 더 많이</div></div>
      <div class="f"><label>제목 줄</label><div><input type="checkbox" data-ok="title" ${o.noTitle?'':'checked'}> 표시</div></div>
      <div class="hintbox">전체 ${d.data.length}개 → ${pgs}페이지, ${o.secs||10}초마다 다음 페이지로 넘어갑니다.</div>`;
    }else h+=`<div class="hintbox">이 위젯은 크기를 줄이면 글자가 자동으로 함께 줄어듭니다. “직접 정하기”로 고정할 수도 있어요.</div>`;
    h+=`<div class="f" style="margin-top:10px"><label></label><div><button class="btn sm" data-dupw>위젯 복제</button><button class="btn sm danger" data-delw>빼기</button></div></div></section>`;
  }
  $('#inspector').innerHTML=h;
}
$('#inspector').addEventListener('input',e=>{
  const t=e.target,p=S.pages[cur];
  if(t.dataset.pk){p[t.dataset.pk]=t.dataset.pk==='secs'?clamp(+t.value||5,5,600):t.value;save();tabs();return}
  const it=p.items.find(i=>i.uid===sel);if(!it||!t.dataset.ok)return;const k=t.dataset.ok,o=it.opts;
  if(k==='fs'){o.fs=+t.value;t.nextElementSibling.textContent=o.fs+'%'}
  else if(k==='secs')o.secs=clamp(+t.value||10,3,120);
  save();rerenderWidget(it.uid);
});
$('#inspector').addEventListener('change',e=>{
  const t=e.target,p=S.pages[cur],it=p.items.find(i=>i.uid===sel);if(!it||!t.dataset.ok)return;const k=t.dataset.ok,o=it.opts;
  if(k==='fsmode'){if(t.value==='man')o.fs=Math.round(baseScale(it)*100/5)*5;else delete o.fs}
  else if(k==='n'){+t.value?o.n=+t.value:delete o.n;idx[it.uid]=0}
  else if(k==='compact'){t.checked?o.compact=1:delete o.compact;idx[it.uid]=0}
  else if(k==='title'){t.checked?delete o.noTitle:o.noTitle=1}
  save();rerenderWidget(it.uid);inspect();
});
$('#inspector').addEventListener('click',e=>{
  const p=S.pages[cur],b=e.target.closest('button');if(!b)return;
  if(b.dataset.mv){const j=cur+ +b.dataset.mv;if(j>=0&&j<S.pages.length){[S.pages[cur],S.pages[j]]=[S.pages[j],S.pages[cur]];cur=j;save();render()}}
  else if('dup' in b.dataset){const c=JSON.parse(JSON.stringify(p));c.id=nid();c.name=p.name+' 복사';c.items.forEach(i=>i.uid=nid());S.pages.splice(cur+1,0,c);cur++;save();render()}
  else if('delpage' in b.dataset){if(confirm(`'${p.name}' 화면을 삭제할까요?`)){S.pages.splice(cur,1);cur=Math.max(0,cur-1);sel=null;save();render()}}
  else if('delw' in b.dataset){p.items=p.items.filter(i=>i.uid!==sel);sel=null;save();render()}
  else if('dupw' in b.dataset){const it=p.items.find(i=>i.uid===sel);if(it)addItem(it.type,JSON.parse(JSON.stringify(it.opts)))}
});

/* ============ 위젯 추가 ============ */
$('#addMenu').innerHTML=Object.entries(T).map(([k,d])=>`<div class="mi" data-add="${k}">${d.name}<small>${d.size[0]}×${d.size[1]}칸</small></div>`).join('');
$('#addBtn').addEventListener('click',e=>{e.stopPropagation();$('#addMenu').classList.toggle('open')});
document.addEventListener('click',()=>$('#addMenu').classList.remove('open'));
$('#addMenu').addEventListener('click',e=>{const k=e.target.closest('[data-add]');if(k)addItem(k.dataset.add)});
function addItem(type,opts){
  if(mode!=='edit')return;const d=T[type],p=S.pages[cur];
  for(const [w,h] of [d.size,d.min]){
    for(let y=0;y<=ROWS-h;y++)for(let x=0;x<=COLS-w;x++){const r={x,y,w,h};if(free(r,null)){const it={uid:nid(),type,...r,opts:opts||{}};p.items.push(it);sel=it.uid;save();render();return}}
  }
  alert('남은 자리가 없어요. 다른 위젯 크기를 줄이거나 빼고 다시 추가하세요.');
}

/* ============ 끌기 / 크기 조절 / 선택 ============ */
let act=null;
canvas.addEventListener('pointerdown',e=>{
  if(mode!=='edit')return;const el=e.target.closest('.widget');if(!el)return;
  const p=page(),it=p.items.find(i=>i.uid===el.dataset.uid);
  if(e.target.closest('[data-x]')){p.items=p.items.filter(i=>i!==it);if(sel===it.uid)sel=null;save();render();return}
  const r=canvas.getBoundingClientRect();
  act={el,it,mode:e.target.classList.contains('rs')?'resize':'move',sx:e.clientX,sy:e.clientY,cw:r.width/COLS,ch:r.height/ROWS,orig:{x:it.x,y:it.y,w:it.w,h:it.h},cur:{x:it.x,y:it.y,w:it.w,h:it.h},moved:false};
  el.classList.add('drag');el.setPointerCapture(e.pointerId);e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
  if(!act)return;const dx=Math.round((e.clientX-act.sx)/act.cw),dy=Math.round((e.clientY-act.sy)/act.ch),o=act.orig;
  if(dx||dy)act.moved=true;let r;
  if(act.mode==='move')r={...o,x:clamp(o.x+dx,0,COLS-o.w),y:clamp(o.y+dy,0,ROWS-o.h)};
  else{const m=T[act.it.type].min;r={...o,w:clamp(o.w+dx,m[0],COLS-o.x),h:clamp(o.h+dy,m[1],ROWS-o.y)}}
  act.cur=r;place(act.el,r);act.el.classList.toggle('bad',!free(r,act.it.uid));
});
function end(){
  if(!act)return;const a=act;act=null;
  const ok=free(a.cur,a.it.uid);
  if(a.moved&&ok){Object.assign(a.it,a.cur);save()}
  sel=a.it.uid;render(); // 놓은 위젯 선택 + 크기가 바뀌었으면 글자 크기 다시 맞춤
}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);

/* ============ 슬라이드쇼 (미리보기) ============ */
let ticker=null;
function startShow(){
  stopShow();idx={};vp=0;pageStart=Date.now();const start={};render();
  ticker=setInterval(()=>{
    const now=Date.now(),p=S.pages[vp];
    p.items.forEach(it=>{const d=T[it.type];if(!d.list)return;
      const n=perPage(it,scaleOf(it));if(Math.ceil(d.data.length/n)<2)return;
      start[it.uid]=start[it.uid]||now;
      if(now-start[it.uid]>=(it.opts.secs||10)*1000){start[it.uid]=now;idx[it.uid]=(idx[it.uid]||0)+1;rerenderWidget(it.uid)}});
    const el=now-pageStart,bar=$('#pbar');if(bar)bar.style.width=Math.min(100,el/(p.secs*1000)*100)+'%';
    if(el>=p.secs*1000&&S.pages.length>1)goPage((vp+1)%S.pages.length);
    else if(el>=p.secs*1000)pageStart=now;
  },250);
}
function goPage(i){
  canvas.classList.add('fade');
  setTimeout(()=>{vp=(i+S.pages.length)%S.pages.length;idx={};pageStart=Date.now();render();canvas.classList.remove('fade')},350);
}
function stopShow(){clearInterval(ticker);ticker=null}
document.addEventListener('keydown',e=>{if(mode==='view'&&e.key==='ArrowRight')goPage(vp+1);if(mode==='view'&&e.key==='ArrowLeft')goPage(vp-1)});

/* ============ 상단 버튼 ============ */
function setMode(m){
  mode=m;root.classList.toggle('editing',m==='edit');root.classList.toggle('viewing',m==='view');
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#pages').style.display=$('#inspector').style.display=$('#addBtn').parentNode.style.display=m==='edit'?'':'none';
  if(m==='view')startShow();else{stopShow();idx={};render()}
}
$('#modeSeg').addEventListener('click',e=>{const m=e.target.dataset.m;if(m)setMode(m)});
$('#themeSeg').addEventListener('click',e=>{const t=e.target.dataset.t;if(!t)return;root.classList.toggle('theme-dark',t==='dark');root.classList.toggle('theme-light',t==='light');document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))});
$('#reset').addEventListener('click',()=>{if(confirm('기본 구성(2개 화면)으로 되돌릴까요?')){S=DEFAULT();cur=0;sel=null;save();render()}});
$('#fs').addEventListener('click',()=>{if(mode!=='view')setMode('view');canvas.requestFullscreen&&canvas.requestFullscreen()});
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!act)render()},120)}).observe(canvas);
render();
</script>
</body>
</html>
