name: Auto Open and Close Camp Registrations

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-camp-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update camp registration status
        run: node scripts/auto-open-camps.mjs

      - name: Commit and push changes
        run: |
          git config user.name "wolko-bot"
          git config user.email "wolkorea1@gmail.com"
          git add src/content/camp_schedules/
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: update camp registration status [automated]" && git push)
