name: Drive reminders

# 정기 실행은 Cloudflare 통합 알림 스케줄러가 담당한다. 이 워크플로는 수동 점검 전용이다.
#   오전 픽업: 요일과 상관없이 신청이 있는 날 · 오후 드롭오프: 요일별 설정(기본 화~목 17:00, 금 12:00)
# 시각은 운행 스케줄 페이지의 '알림 시간'에서 바꾼다. GitHub 스케줄은 몇 분 늦을 수 있어, 발송 시각 뒤 5시간 안이면 보낸다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show the plan (nothing is sent)'
        type: boolean
        default: true
      slot:
        description: 'Which reminder'
        type: choice
        options: [both, pickup, dropoff]
        default: both
      force:
        description: 'Send right now, ignoring the set time (manual test)'
        type: boolean
        default: false
      test_phone:
        description: 'Send ONE test message to this phone number only (e.g. 01012345678; uses the chosen slot, pickup if both). Nobody else is messaged.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: drive-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the reminders that are due
        env:
          DRIVE_REMINDER_SECRET: ${{ secrets.DRIVE_REMINDER_SECRET || secrets.CRS_REMINDER_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SLOT: ${{ inputs.slot }}
          FORCE: ${{ inputs.force }}
          TEST_PHONE: ${{ inputs.test_phone }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DRIVE_REMINDER_SECRET" || { echo 'Missing DRIVE_REMINDER_SECRET (or CRS_REMINDER_SECRET)'; exit 1; }
          query=''
          if [ "$DRY_RUN" = 'true' ]; then query="$query&dryRun=1"; fi
          if [ "$FORCE" = 'true' ]; then query="$query&force=1"; fi
          if [ "$INPUT_SLOT" = 'pickup' ] || [ "$INPUT_SLOT" = 'dropoff' ]; then query="$query&slot=$INPUT_SLOT"; fi
          if [ -n "$TEST_PHONE" ]; then query="$query&testPhone=$(printf '%s' "$TEST_PHONE" | tr -cd '0-9')"; fi
          url="https://wolko.org/api/car/drive-reminders?${query#&}"
          for attempt in 1 2 3; do
            if result=$(curl --fail-with-body --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $DRIVE_REMINDER_SECRET" "$url"); then
              echo "$result" | jq '.'
              exit 0
            fi
            echo "Server said: ${result:-(no body)}"
            echo "Attempt $attempt failed"; sleep 20
          done
          exit 1
