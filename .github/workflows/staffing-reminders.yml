name: Weekly staffing reminder

# 매주 월요일 한국 시간 오전 9시 30분(= UTC 월요일 00:30)에, 이번 주에 아직 비어 있는 차량 운행·주방 보조 자리를 영어 메일로 Estelle에게 알린다.
# Cloudflare 통합 스케줄러가 확인·재시도한다. 이 워크플로는 수동 점검 전용이다.
# 비어 있는 자리가 없으면 메일을 보내지 않는다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show which slots are open (nothing is sent)'
        type: boolean
        default: true
      force:
        description: 'Send now even if it is not Monday or the weekly mail was already sent'
        type: boolean
        default: false
      to:
        description: 'Send ONE test mail to this address only (nobody else is mailed, nothing is recorded)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: staffing-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the weekly reminder
        env:
          REMINDER_SECRET: ${{ secrets.STAFFING_REMINDER_SECRET || secrets.KITCHEN_REMINDER_SECRET || secrets.DRIVE_REMINDER_SECRET || secrets.CRS_REMINDER_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          TEST_TO: ${{ inputs.to }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REMINDER_SECRET" || { echo 'Missing STAFFING_/KITCHEN_/DRIVE_/CRS_REMINDER_SECRET'; exit 1; }
          query=''
          if [ "$DRY_RUN" = 'true' ]; then query="$query&dryRun=1"; fi
          if [ "$FORCE" = 'true' ]; then query="$query&force=1"; fi
          if [ -n "$TEST_TO" ]; then query="$query&to=$(printf '%s' "$TEST_TO" | jq -sRr @uri)"; fi
          url="https://wolko.org/api/staffing/weekly-reminder?${query#&}"
          for attempt in 1 2 3; do
            if result=$(curl --fail-with-body --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $REMINDER_SECRET" "$url"); then
              echo "$result" | jq '.'
              exit 0
            fi
            echo "Server said: ${result:-(no body)}"
            echo "Attempt $attempt failed"; sleep 20
          done
          exit 1
