name: Camp team weekly mail

# 매주 화요일 한국 시간 오전 9시(= UTC 화요일 00:00)에 캠프팀 팀원에게 "이번 주 할 일" 이메일을 보낸다.
# 이번 주에 보여 줄 내용이 없는 사람, 받기를 끈 사람, 이미 이번 주에 받은 사람에게는 보내지 않는다.
# GitHub 스케줄은 몇 분 늦을 수 있다. 같은 주에 두 번 보내지 않도록 서버가 발송 기록을 확인한다.
# 수동 실행(Run workflow)은 기본이 "미리 보기만"이라 아무에게도 보내지 않는다.
on:
  schedule:
    - cron: '0 0 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show who would get a mail (nothing is sent)'
        type: boolean
        default: true
      force:
        description: 'Send even if it is not Tuesday or the mail was already sent this week'
        type: boolean
        default: false
      to:
        description: 'Send ONE test mail to this address only (nobody else is mailed, nothing is recorded)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: campteam-weekly-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the weekly camp team mail
        env:
          MAIL_SECRET: ${{ secrets.CAMPTEAM_MAIL_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
          TEST_TO: ${{ inputs.to }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAIL_SECRET" || { echo 'Missing CAMPTEAM_MAIL_SECRET'; exit 1; }
          query=''
          if [ "$DRY_RUN" = 'true' ]; then query="$query&dryRun=1"; fi
          if [ "$FORCE" = 'true' ]; then query="$query&force=1"; fi
          if [ -n "$TEST_TO" ]; then query="$query&to=$(printf '%s' "$TEST_TO" | jq -sRr @uri)"; fi
          url="https://wolko.org/api/campteam/weekly-mail?${query#&}"
          for attempt in 1 2 3; do
            if result=$(curl --fail-with-body --silent --show-error --max-time 120 -X POST -H "Authorization: Bearer $MAIL_SECRET" "$url"); then
              echo "$result" | jq '.'
              exit 0
            fi
            echo "Server said: ${result:-(no body)}"
            echo "Attempt $attempt failed"; sleep 20
          done
          exit 1
