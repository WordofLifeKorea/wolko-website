name: Kitchen reminders

# 30분마다(한국 시간 06:00~21:30) 깨어나서, 주방 관리자가 정해 둔 발송 시각이 된 알림만 보낸다.
#   칸(오전·점심·저녁 × 준비·클린업)마다 정해 둔 시각에, 신청이 있는 날 담당자에게 보낸다(기본 7:00 · 9:00 · 10:00 · 13:00 · 15:00 · 18:30).
# 시각은 주방 보조 페이지의 '알림 시간'에서 바꾼다. GitHub 스케줄은 몇 분 늦을 수 있어, 발송 시각 뒤 5시간 안이면 보낸다.
on:
  schedule:
    - cron: '0,30 21-23,0-12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show the plan (nothing is sent)'
        type: boolean
        default: true
      slot:
        description: 'Which reminder'
        type: choice
        options: [all, am_prep, am_clean, lunch_prep, lunch_clean, dinner_prep, dinner_clean]
        default: all
      force:
        description: 'Send right now, ignoring the set time (manual test)'
        type: boolean
        default: false
      test_phone:
        description: 'Send ONE test message to this phone number only (e.g. 01012345678; uses the chosen slot, lunch_prep if all). Nobody else is messaged.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: kitchen-reminder
  cancel-in-progress: false

jobs:
  remind:
    if: vars.KITCHEN_REMINDERS_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the reminders that are due
        env:
          KITCHEN_REMINDER_SECRET: ${{ secrets.KITCHEN_REMINDER_SECRET || secrets.DRIVE_REMINDER_SECRET || secrets.CRS_REMINDER_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_SLOT: ${{ inputs.slot }}
          FORCE: ${{ inputs.force }}
          TEST_PHONE: ${{ inputs.test_phone }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KITCHEN_REMINDER_SECRET" || { echo 'Missing KITCHEN_REMINDER_SECRET (or DRIVE_/CRS_REMINDER_SECRET)'; exit 1; }
          query=''
          if [ "$DRY_RUN" = 'true' ]; then query="$query&dryRun=1"; fi
          if [ "$FORCE" = 'true' ]; then query="$query&force=1"; fi
          if [ -n "$INPUT_SLOT" ] && [ "$INPUT_SLOT" != 'all' ]; then query="$query&slot=$INPUT_SLOT"; fi
          if [ -n "$TEST_PHONE" ]; then query="$query&testPhone=$(printf '%s' "$TEST_PHONE" | tr -cd '0-9')"; fi
          url="https://wolko.org/api/kitchen/reminders?${query#&}"
          for attempt in 1 2 3; do
            if result=$(curl --fail-with-body --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $KITCHEN_REMINDER_SECRET" "$url"); then
              echo "$result" | jq '.'
              exit 0
            fi
            echo "Server said: ${result:-(no body)}"
            echo "Attempt $attempt failed"; sleep 20
          done
          exit 1
