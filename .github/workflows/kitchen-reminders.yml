name: Kitchen reminders

# 정기 발송은 workers/kitchen-scheduler의 Cloudflare Cron Trigger가 담당한다.
# 이 워크플로는 수동 점검과 비상 발송 전용이다. 두 스케줄러를 동시에 켜지 않는다.
#   식사 시간은 주방 보조 페이지의 '시간·인원'에서 바꾼다(기본 아침 9:00 · 점심 12:30 · 저녁 17:00 → 알림 8:00 · 11:30 · 16:00).
# GitHub 스케줄은 몇 분 늦을 수 있어서, 식사 시간 전까지는 늦게 돌아도 보낸다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show the plan (nothing is sent)'
        type: boolean
        default: true
      meal:
        description: 'Which meal'
        type: choice
        options: [all, am, lunch, dinner]
        default: all
      force:
        description: 'Send right now, ignoring the set time (manual test)'
        type: boolean
        default: false
      test_phone:
        description: 'Send ONE test message to this phone number only (e.g. 01012345678; uses the chosen meal, lunch if all). Nobody else is messaged.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: kitchen-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the reminders that are due
        env:
          KITCHEN_REMINDER_SECRET: ${{ secrets.KITCHEN_REMINDER_SECRET || secrets.DRIVE_REMINDER_SECRET || secrets.CRS_REMINDER_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MEAL: ${{ inputs.meal }}
          FORCE: ${{ inputs.force }}
          TEST_PHONE: ${{ inputs.test_phone }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KITCHEN_REMINDER_SECRET" || { echo 'Missing KITCHEN_REMINDER_SECRET (or DRIVE_/CRS_REMINDER_SECRET)'; exit 1; }
          query=''
          if [ "$DRY_RUN" = 'true' ]; then query="$query&dryRun=1"; fi
          if [ "$FORCE" = 'true' ]; then query="$query&force=1"; fi
          if [ "$INPUT_MEAL" = 'am' ] || [ "$INPUT_MEAL" = 'lunch' ] || [ "$INPUT_MEAL" = 'dinner' ]; then query="$query&meal=$INPUT_MEAL"; fi
          if [ -n "$TEST_PHONE" ]; then query="$query&testPhone=$(printf '%s' "$TEST_PHONE" | tr -cd '0-9')"; fi
          url="https://wolko.org/api/kitchen/reminders?${query#&}"
          for attempt in 1 2 3; do
            if result=$(curl --fail-with-body --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $KITCHEN_REMINDER_SECRET" "$url"); then
              echo "$result" | jq '.'
              exit 0
            fi
            echo "Server said: ${result:-(no body)}"
            echo "Attempt $attempt failed"; sleep 20
          done
          exit 1
