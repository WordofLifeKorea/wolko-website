name: Open 2026 Camp Registrations

on:
  workflow_dispatch:

jobs:
  open-camps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set camp status to open
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src/content/camp_schedules/2026-inland-english-junior.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            data.status = 'open';
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
            console.log('English junior camp open');
          "
          node -e "
            const fs = require('fs');
            const path = 'src/content/camp_schedules/2026-inland-union.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            data.status = 'open';
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
            console.log('Union camp open');
          "

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/camp_schedules/2026-inland-english-junior.json
          git add src/content/camp_schedules/2026-inland-union.json
          git diff --staged --quiet && echo "No changes" || git commit -m "chore: open 2026 camp registrations [automated]"
          git push
