# 로컬 테스트 전용 설정 (배포에 쓰이지 않음 — 이름이 wrangler.toml 이 아니고 루트에 있지 않다).
# D1 은 이 컴퓨터 안의 임시 데이터베이스이며 Cloudflare 계정에 접속하지 않는다.
name = "campteam-local"
compatibility_date = "2024-09-23"
pages_build_output_dir = "../../dist"

[[d1_databases]]
binding = "DB"
database_name = "campteam-local"
database_id = "00000000-0000-0000-0000-000000000000"
