# 마이그레이션 전용 설정 예시. 이 파일을 저장소 밖(예: ~/Documents/wolko-camp-team/wrangler.migrate.toml)에 복사해서
# database_id 만 실제 값으로 바꿔 쓴다. (database_id 는 비밀번호는 아니지만 저장소에는 넣지 않는다)
name = "campteam-migrate"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "wolko-camp-team"
database_id = "여기에-D1-데이터베이스-ID"
