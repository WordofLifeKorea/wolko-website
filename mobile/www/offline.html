<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WOLKO</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f6f8; --ink: #13232c; --sub: #5b6b74; --btn: #004f68; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1f2a; --ink: #e8eef1; --sub: #9fb1ba; --btn: #08799a; } }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; text-align: center; }
    img { width: 72px; height: 72px; margin-bottom: 20px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: var(--sub); margin-bottom: 24px; word-break: keep-all; }
    button { height: 48px; padding: 0 28px; border: 0; border-radius: 2px; background: var(--btn); color: #fff; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="">
    <h1>인터넷에 연결할 수 없어요</h1>
    <p>와이파이나 데이터가 켜져 있는지 확인한 뒤<br>다시 시도해 주세요.</p>
    <button type="button" onclick="location.replace('https://wolko.org/portal/')">다시 시도</button>
  </main>
</body>
</html>
