backend:
  name: github
  repo: WordofLifeKorea/wolko-website
  branch: main
  base_url: https://wolko-cms-auth.wolkorea1.workers.dev

media_folder: public/images/uploads
public_folder: /images/uploads

collections:

  # ── 팀원 (섬기는이) ──────────────────────────────────────
  - name: "team"
    label: "섬기는이 (Team)"
    label_singular: "팀원"
    folder: "src/content/team"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "이름 (한국어)", name: "name_ko", widget: "string" }
      - { label: "Name (English)", name: "name_en", widget: "string" }
      - { label: "직책 (한국어)", name: "title_ko", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - label: "역할 배지"
        name: "role_badge"
        widget: "select"
        options:
          - { label: "Field Director", value: "Field Director" }
          - { label: "Jeju Director", value: "Jeju Director" }
          - { label: "Missionary", value: "Missionary" }
          - { label: "Missionaries", value: "Missionaries" }
          - { label: "Short-term Worker", value: "Short-term Worker" }
      - label: "캠퍼스"
        name: "campus"
        widget: "select"
        options:
          - { label: "평택 (Pyeongtaek)", value: "pyeongtaek" }
          - { label: "제주 (Jeju)", value: "jeju" }
      - label: "구분"
        name: "category"
        widget: "select"
        options:
          - { label: "선교사 (Missionary)", value: "missionary" }
          - { label: "단기 사역자 (Short-term Worker)", value: "stw" }
      - { label: "순서 (숫자 낮을수록 먼저 표시)", name: "order", widget: "number", default: 99 }
      - { label: "사진 — 목록/히어로용", name: "photo_url", widget: "image", required: false, hint: "섬기는이 목록 카드 + 상세 히어로에 쓰이는 사진" }
      - { label: "사진 — 소개용 (스토리 섹션 1)", name: "photo_story", widget: "image", required: false, hint: "개인 소개 섹션에 쓰이는 사진 (목록 사진과 다르게 설정 가능)" }
      - { label: "히어로 태그라인 1 (한국어)", name: "hero_tagline_ko", widget: "string", required: false, hint: "예: 복음을 담은 — 히어로 큰 제목 첫 줄 (없으면 이름으로 대체)" }
      - { label: "Hero Tagline 1 (English)", name: "hero_tagline_en", widget: "string", required: false, hint: "e.g. Media & Education — hero headline line 1 (falls back to name)" }
      - { label: "히어로 태그라인 2 — 이탤릭 (한국어)", name: "hero_tagline2_ko", widget: "string", required: false, hint: "예: 미디어 & 교육 사역 — 히어로 이탤릭 두 번째 줄" }
      - { label: "Hero Tagline 2 — italic (English)", name: "hero_tagline2_en", widget: "string", required: false, hint: "e.g. Filled with the Gospel — hero italic subtitle line" }
      - { label: "히어로 한 줄 소개 (한국어) — 세로줄 옆에 표시", name: "hero_subtitle_ko", widget: "string", required: false, hint: "예: 평택 월코센터 · 청소년 및 캠프 사역" }
      - { label: "Hero Subtitle (English) — shown next to vertical line", name: "hero_subtitle_en", widget: "string", required: false, hint: "e.g. Pyeongtaek WOLKO Center · Youth & Camp Ministry" }
      - label: "Life Verse — 성경 구절 참조"
        name: "verse_ref"
        widget: "string"
        required: false
        hint: "예: 마태복음 9:36-38 / Matthew 9:36-38"
      - { label: "Life Verse 본문 (한국어)", name: "verse_ko", widget: "text", required: false, hint: "구절 전체 본문을 한국어로 입력하세요" }
      - { label: "Life Verse Text (English)", name: "verse_en", widget: "text", required: false, hint: "Enter the full verse text in English" }
      - { label: "소개 (한국어)", name: "bio_ko", widget: "text", required: false }
      - { label: "Bio (English)", name: "bio_en", widget: "text", required: false }
      - { label: "소개 2 — 한국어 (부부 선교사 두 번째 분)", name: "bio_ko_2", widget: "text", required: false }
      - { label: "Bio 2 — English (2nd person, couple missionaries only)", name: "bio_en_2", widget: "text", required: false }
      - { label: "사진 2 (두 번째 분 개인 사진)", name: "photo_url_2", widget: "image", required: false }

  # ── 소식 / 선교보고 ──────────────────────────────────────
  - name: "news"
    label: "소식 (News)"
    label_singular: "소식"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    i18n: true
    fields:
      - { label: "제목 (한국어)", name: "title_ko", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime" }
      - { label: "썸네일 이미지", name: "thumbnail", widget: "image", required: false }
      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - { label: "선교보고", value: "mission-report" }
          - { label: "캠프 소식", value: "camp" }
          - { label: "제주월비", value: "wolbi" }
          - { label: "청소년 사역", value: "youth" }
          - { label: "일반 소식", value: "general" }
      - { label: "내용 (한국어)", name: "body_ko", widget: "markdown" }
      - { label: "Content (English)", name: "body_en", widget: "markdown", required: false }

  # ── 기도 제목 ──────────────────────────────────────────
  - name: "prayer"
    label: "기도 제목 (Prayer Requests)"
    label_singular: "기도 제목"
    folder: "src/content/prayer"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: "제목 (한국어)", name: "title_ko", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime" }
      - { label: "내용 (한국어)", name: "body_ko", widget: "markdown" }
      - { label: "Content (English)", name: "body_en", widget: "markdown", required: false }

  # ── 선교보고 ──────────────────────────────────────────
  - name: "mission_report"
    label: "선교보고 (Mission Reports)"
    label_singular: "선교보고"
    folder: "src/content/mission_report"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "제목 (한국어)", name: "title_ko", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime" }
      - { label: "PDF URL", name: "pdf_url", widget: "string", hint: "PDF 파일 URL (예: /images/uploads/report-2025-01.pdf 또는 외부 링크)" }
      - { label: "썸네일 이미지 URL", name: "thumbnail_url", widget: "string", required: false, hint: "소식지 표지 이미지 URL" }
      - { label: "소개 (한국어)", name: "description_ko", widget: "text", required: false }
      - { label: "Description (English)", name: "description_en", widget: "text", required: false }

  # ── 사이트 설정 ────────────────────────────────────────
  - name: "settings"
    label: "사이트 설정 (Settings)"
    files:
      - name: "general"
        label: "일반 설정"
        file: "src/content/settings/general.json"
        fields:
          - { label: "사이트 제목 (KO)", name: "site_title_ko", widget: "string" }
          - { label: "Site Title (EN)", name: "site_title_en", widget: "string" }
          - { label: "유튜브 영상 ID", name: "youtube_id", widget: "string", hint: "예: pDTo4oNcAMg" }
          - { label: "한국청소년 복음화율 통계", name: "gospel_rate", widget: "string", default: "3" }
