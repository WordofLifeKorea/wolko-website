backend:
  name: github
  repo: WordofLifeKorea/wolko-website
  branch: main
  base_url: https://wolko-cms-auth.wolkousa1.workers.dev

media_folder: public/images/uploads
public_folder: /images/uploads

collections:

  # ── 섬기는이 ──────────────────────────────────────────────
  - name: "team"
    label: "섬기는이 (Team)"
    label_singular: "팀원"
    folder: "src/content/team"
    create: true
    slug: "{{slug}}"
    fields:

      # 기본 정보
      - { label: "이름 (한국어)", name: "name_ko", widget: "string", hint: "부부 선교사는 '이름1 & 이름2' 형식으로 입력 (예: 몰스 제이콥 & 몰스 크리스탈)" }
      - { label: "Name (English)", name: "name_en", widget: "string", hint: "Couple: 'Name1 & Name2' (e.g. Jacob Morse & Crystal Morse)" }
      - { label: "직책 (한국어)", name: "title_ko", widget: "string", hint: "예: 청소년 및 캠프 사역 코디네이터" }
      - { label: "Title (English)", name: "title_en", widget: "string", hint: "e.g. Youth & Camp Ministry Coordinator" }
      - label: "역할 배지"
        name: "role_badge"
        widget: "select"
        options:
          - { label: "Field Director", value: "Field Director" }
          - { label: "Jeju Director", value: "Jeju Director" }
          - { label: "Missionary", value: "Missionary" }
          - { label: "Missionaries", value: "Missionaries" }
          - { label: "Short-term Worker", value: "Short-term Worker" }
      - label: "캠퍼스"
        name: "campus"
        widget: "select"
        options:
          - { label: "평택 (Pyeongtaek)", value: "pyeongtaek" }
          - { label: "제주 (Jeju)", value: "jeju" }
      - label: "구분"
        name: "category"
        widget: "select"
        options:
          - { label: "선교사 (Missionary)", value: "missionary" }
          - { label: "단기 사역자 (Short-term Worker)", value: "stw" }
      - { label: "표시 순서", name: "order", widget: "number", default: 99, hint: "숫자가 낮을수록 목록에서 먼저 표시됩니다" }

      # ── 사진 ──
      - { label: "📸 사진 ① 목록/히어로용", name: "photo_url", widget: "image", required: false, hint: "섬기는이 목록 카드와 상세 페이지 히어로에 사용됩니다" }
      - { label: "📸 사진 ② 소개용 (스토리 섹션)", name: "photo_story", widget: "image", required: false, hint: "개인 소개 스토리 섹션에 사용. 비어있으면 ①번 사진으로 대체됩니다" }
      - { label: "📸 사진 ③ 배우자 사진 (부부 선교사만)", name: "photo_url_2", widget: "image", required: false, hint: "부부 선교사의 두 번째 스토리 블록에 표시됩니다" }

      # ── 히어로 문구 ──
      - { label: "히어로 제목 1 (한국어)", name: "hero_tagline_ko", widget: "string", required: false, hint: "히어로 굵은 제목 첫 줄 (예: 복음을 담은). 비어있으면 이름이 표시됩니다" }
      - { label: "Hero Title 1 (English)", name: "hero_tagline_en", widget: "string", required: false, hint: "Hero bold headline (e.g. Media & Education). Falls back to name if empty" }
      - { label: "히어로 제목 2 — 이탤릭 (한국어)", name: "hero_tagline2_ko", widget: "string", required: false, hint: "히어로 이탤릭 두 번째 줄 (예: 미디어 & 교육 사역). 비어있으면 직책이 표시됩니다" }
      - { label: "Hero Title 2 — italic (English)", name: "hero_tagline2_en", widget: "string", required: false, hint: "Italic subtitle (e.g. Filled with the Gospel). Falls back to title if empty" }
      - { label: "히어로 설명 한 줄 (한국어)", name: "hero_subtitle_ko", widget: "string", required: false, hint: "세로줄 옆 짧은 설명 (예: 평택 월코센터 · 청소년 및 캠프 사역). 비어있으면 소개 일부가 표시됩니다" }
      - { label: "Hero Description (English)", name: "hero_subtitle_en", widget: "string", required: false, hint: "Short line next to vertical bar (e.g. Pyeongtaek · Youth & Camp Ministry)" }

      # ── Life Verse ──
      - { label: "Life Verse 성경 참조", name: "verse_ref", widget: "string", required: false, hint: "예: 시편 96:2-3 / Psalm 96:2-3" }
      - { label: "Life Verse 본문 (한국어)", name: "verse_ko", widget: "text", required: false, hint: "구절 전체 본문 입력. 비어있으면 마태복음 9:36-38이 기본으로 표시됩니다" }
      - { label: "Life Verse Text (English)", name: "verse_en", widget: "text", required: false, hint: "Full verse text. Defaults to Matthew 9:36-38 if empty" }

      # ── 배우자 ──
      - { label: "배우자 이름 (한국어)", name: "spouse_ko", widget: "string", required: false, hint: "부부 선교사만 입력. 예: 김씬띠아" }
      - { label: "Spouse Name (English)", name: "spouse_en", widget: "string", required: false, hint: "Couples only. e.g. Cynthia Kim" }
      - label: "배우자 섹션 표시"
        name: "show_spouse"
        widget: "boolean"
        default: false
        hint: "체크하면 프로필 페이지에 배우자 소개 섹션이 표시됩니다"

      # ── 소개 ──
      - { label: "소개 (한국어)", name: "bio_ko", widget: "text", required: false, hint: "개인 소개 스토리. 부부 선교사는 첫 번째 분의 소개를 입력하세요" }
      - { label: "Bio (English)", name: "bio_en", widget: "text", required: false }
      - { label: "배우자 소개 (한국어) — 부부 선교사만", name: "bio_ko_2", widget: "text", required: false, hint: "부부 선교사의 경우 두 번째 분 소개를 여기에 입력하세요" }
      - { label: "Spouse Bio (English) — couples only", name: "bio_en_2", widget: "text", required: false }

      # ── 기도제목 ──
      - { label: "기도제목 (한국어)", name: "prayer_ko", widget: "text", required: false, hint: "중보기도 섹션에 표시됩니다" }
      - { label: "Prayer Request (English)", name: "prayer_en", widget: "text", required: false }

      # ── 후원 ──
      - { label: "후원 링크 URL", name: "support_url", widget: "string", required: false, hint: "예: https://online.mrm.or.kr/XXLJGid — 입력하면 후원하기 버튼이 이 링크로 연결됩니다" }

  # ── 소식 ─────────────────────────────────────────────────
  - name: "news"
    label: "소식 (News)"
    label_singular: "소식"
    folder: "src/content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "제목 (한국어)", name: "title_ko", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime" }
      - { label: "썸네일 이미지", name: "thumbnail", widget: "image", required: false }
      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - { label: "선교보고", value: "mission-report" }
          - { label: "캠프 소식", value: "camp" }
          - { label: "제주월비", value: "wolbi" }
          - { label: "청소년 사역", value: "youth" }
          - { label: "일반 소식", value: "general" }
      - { label: "내용 (한국어)", name: "body_ko", widget: "markdown" }
      - { label: "Content (English)", name: "body_en", widget: "markdown", required: false }

  # ── 기도 제목 ─────────────────────────────────────────────
  - name: "prayer"
    label: "기도 제목 (Prayer Requests)"
    label_singular: "기도 제목"
    folder: "src/content/prayer"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: "제목 (한국어)", name: "title_ko", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime" }
      - { label: "내용 (한국어)", name: "body_ko", widget: "markdown" }
      - { label: "Content (English)", name: "body_en", widget: "markdown", required: false }

  # ── 선교보고 ──────────────────────────────────────────────
  - name: "mission_report"
    label: "선교보고 (Mission Reports)"
    label_singular: "선교보고"
    folder: "src/content/mission_report"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "제목 (한국어)", name: "title_ko", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "날짜", name: "date", widget: "datetime" }
      - { label: "PDF URL", name: "pdf_url", widget: "string", hint: "예: /images/uploads/report-2025-01.pdf 또는 외부 링크" }
      - { label: "썸네일 이미지 URL", name: "thumbnail_url", widget: "string", required: false }
      - { label: "소개 (한국어)", name: "description_ko", widget: "text", required: false }
      - { label: "Description (English)", name: "description_en", widget: "text", required: false }

  # ── 캠프 일정 ──────────────────────────────────────────────
  - name: "camp_schedule"
    label: "캠프 일정 (Camp Schedule)"
    label_singular: "캠프 일정"
    folder: "src/content/camp_schedules"
    create: true
    slug: "{{year}}-{{slug}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "캠프명 (한국어)", name: "title_ko", widget: "string", hint: "예: 2025 여름 영어캠프" }
      - { label: "Camp Title (English)", name: "title_en", widget: "string", hint: "e.g. 2025 Summer English Camp" }
      - label: "캠프 종류"
        name: "camp_type"
        widget: "select"
        options:
          - { label: "영어캠프 (English Camp)", value: "english" }
          - { label: "제주캠프 (Jeju Camp)", value: "jeju" }
          - { label: "연합캠프 (Union Camp)", value: "union" }
      - { label: "날짜 (한국어)", name: "date_ko", widget: "string", hint: "예: 2025년 7월 28일 – 8월 1일" }
      - { label: "Date (English)", name: "date_en", widget: "string", hint: "e.g. July 28 – August 1, 2025" }
      - { label: "대상 (한국어)", name: "target_ko", widget: "string", hint: "예: 초등학교 4학년 – 중학교 3학년" }
      - { label: "Target Group (English)", name: "target_en", widget: "string", hint: "e.g. Grades 4–9" }
      - label: "신청 상태"
        name: "status"
        widget: "select"
        options:
          - { label: "신청 중 (Open)", value: "open" }
          - { label: "마감 (Closed)", value: "closed" }
          - { label: "준비 중 (Upcoming)", value: "upcoming" }
          - { label: "정원 마감 (Full)", value: "full" }
      - { label: "신청 링크 URL", name: "registration_url", widget: "string", required: false, hint: "예: https://cafe.naver.com/wolcamp (제주) 또는 https://cafe.naver.com/wolkojrcamp (내륙)" }
      - label: "신청 방식"
        name: "use_external_form"
        widget: "select"
        required: false
        default: "false"
        options:
          - { label: "자체 신청 모달 사용 (기본)", value: "false" }
          - { label: "외부 링크 연결 (네이버 카페 등)", value: "true" }
        hint: "'외부 링크 연결' 선택 시 신청하기 버튼이 위의 URL로 연결됩니다. 비워두면 자체 모달이 사용됩니다."
      - { label: "신청 마감일 (한국어)", name: "deadline_ko", widget: "string", required: false, hint: "예: 2026년 5월 23일 오전 7시 (선착순)" }
      - { label: "Registration Deadline (English)", name: "deadline_en", widget: "string", required: false, hint: "e.g. May 23, 2026, 7:00 AM (First-come, first-served)" }
      - { label: "참가비 (한국어)", name: "price_ko", widget: "string", required: false, hint: "예: 90,000원" }
      - { label: "Price (English)", name: "price_en", widget: "string", required: false, hint: "e.g. KRW 90,000" }
      - { label: "문의 전화", name: "contact_phone", widget: "string", required: false, hint: "예: 064-799-6084 (제주) / 031-611-9216 (평택). 비어있으면 기본 번호가 표시됩니다." }
      - { label: "문의 이메일", name: "contact_email", widget: "string", required: false, hint: "비어있으면 wolkorea1@gmail.com이 표시됩니다." }
      - { label: "안내 사항 (한국어)", name: "notes_ko", widget: "text", required: false }
      - { label: "Notes (English)", name: "notes_en", widget: "text", required: false }
      - { label: "정원 (명)", name: "capacity", widget: "number", default: 60, hint: "최대 신청 가능 인원수. 외부 신청 폼 사용 시에는 표시되지 않습니다." }
      - { label: "표시 순서", name: "order", widget: "number", default: 99, hint: "숫자가 낮을수록 먼저 표시됩니다" }

  # ── 사이트 설정 ───────────────────────────────────────────
  - name: "settings"
    label: "사이트 설정 (Settings)"
    files:
      - name: "general"
        label: "일반 설정"
        file: "src/content/settings/general.json"
        fields:
          - { label: "사이트 제목 (KO)", name: "site_title_ko", widget: "string" }
          - { label: "Site Title (EN)", name: "site_title_en", widget: "string" }
          - { label: "유튜브 영상 ID", name: "youtube_id", widget: "string", hint: "예: pDTo4oNcAMg" }
          - { label: "한국청소년 복음화율 통계", name: "gospel_rate", widget: "string", default: "3" }
